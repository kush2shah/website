<!DOCTYPE html><html lang="en" data-astro-cid-hkbrpulz><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nara · Kush Shah</title><meta name="description" content="Nara: Nara, Japan, Jun 2024. Photography by Kush Shah."><link rel="canonical" href="https://kushs.org/photos/nara/"><link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/logo192.png"><meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)"><script>
            // Photos fade in once they've loaded, and one that fails shows its description
            // instead of a broken image. This runs before <body> is parsed so it sees every
            // load and error. Without JS, photos simply appear as they arrive.
            document.documentElement.classList.add('js');
            document.addEventListener(
                'load',
                (e) => e.target instanceof HTMLImageElement && e.target.toggleAttribute('data-loaded', true),
                true,
            );
            document.addEventListener(
                'error',
                (e) => {
                    const img = e.target;
                    if (!(img instanceof HTMLImageElement) || !img.hasAttribute('data-photo')) return;
                    const box = img.parentElement instanceof HTMLPictureElement ? img.parentElement : img;
                    if (box.nextElementSibling?.classList.contains('photo-failed')) return;
                    const note = document.createElement('span');
                    note.className = 'photo-failed';
                    note.textContent = img.alt || 'Photo unavailable';
                    box.style.display = 'none';
                    box.after(note);
                },
                true,
            );
        </script><meta property="og:type" content="website"><meta property="og:site_name" content="Kush Shah"><meta property="og:url" content="https://kushs.org/photos/nara/"><meta property="og:title" content="Nara · Kush Shah"><meta property="og:description" content="Nara: Nara, Japan, Jun 2024. Photography by Kush Shah."><meta property="og:image" content="https://kushs.org/og-image.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Nara · Kush Shah"><meta name="twitter:description" content="Nara: Nara, Japan, Jun 2024. Photography by Kush Shah."><meta name="twitter:image" content="https://kushs.org/og-image.jpg"><script async src="https://www.googletagmanager.com/gtag/js?id=G-68JR99NH71"></script><script>(function(){const id = "G-68JR99NH71";
